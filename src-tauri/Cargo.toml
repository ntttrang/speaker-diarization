[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
path = "src/lib.rs"

[dependencies]
kodama = "0.3.0"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
rubato = "5.0.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
